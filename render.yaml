services:
  # ASGI web service (HTTP + WebSockets via Channels/daphne)
  - type: web
    name: logistica-web
    runtime: python
    plan: free
    buildCommand: "pip install -r requirements.txt && python manage.py collectstatic --noinput && python manage.py migrate"
    startCommand: "daphne -b 0.0.0.0 -p $PORT logistica_tracking.asgi:application"
    envVars:
      - key: DJANGO_SETTINGS_MODULE
        value: logistica_tracking.settings.production
      - key: PYTHON_VERSION
        value: "3.12.7"
      - key: SECRET_KEY
        generateValue: true
      # Neon Postgres connection string — paste in the Render dashboard.
      # Must include ?sslmode=require (Neon needs SSL).
      - key: DATABASE_URL
        sync: false
      - key: REDIS_URL
        fromService:
          type: redis
          name: logistica-redis
          property: connectionString
      - key: DJANGO_ALLOWED_HOSTS
        sync: false
      - key: CORS_ALLOWED_ORIGINS
        sync: false

  # Redis: Channels layer + Celery broker
  - type: redis
    name: logistica-redis
    plan: free
    maxmemoryPolicy: noeviction
    ipAllowList: []

  # Celery worker (background trip-summary tasks, notifications)
  - type: worker
    name: logistica-worker
    runtime: python
    plan: free
    buildCommand: "pip install -r requirements.txt"
    startCommand: "celery -A logistica_tracking worker --loglevel=info"
    envVars:
      - key: DJANGO_SETTINGS_MODULE
        value: logistica_tracking.settings.production
      - key: PYTHON_VERSION
        value: "3.12.7"
      - key: SECRET_KEY
        fromService:
          type: web
          name: logistica-web
          envVarKey: SECRET_KEY
      - key: DATABASE_URL
        sync: false
      - key: REDIS_URL
        fromService:
          type: redis
          name: logistica-redis
          property: connectionString
