{% load static %}
<!doctype html>
<html lang="en">
<head>
{% include "frontend/_head.html" %}
<title>Driver Dashboard — Logistica</title>
</head>
<body class="bg-base text-ink font-sans h-screen overflow-hidden flex flex-col">

<!-- Top bar -->
<header class="shrink-0 flex items-center justify-between px-6 py-4 border-b border-edge bg-surface">
  <div class="text-sm font-extrabold tracking-widest text-ink">
    LOGISTICA<span class="inline-block w-1.5 h-1.5 rounded-full bg-green align-middle ml-0.5"></span>
  </div>
  <div class="flex items-center gap-2 text-sm">
    <span id="driver-username" class="text-ink font-medium"></span>
    <span class="bg-green/15 text-green text-[10px] font-bold px-2 py-0.5 rounded-full">DRIVER</span>
  </div>
  <div class="flex items-center gap-4">
    <button id="availability-toggle" class="flex items-center gap-2 text-xs text-ink2">
      <span id="availability-track" class="w-9 h-5 rounded-full bg-ink3/40 relative transition">
        <span id="availability-dot" class="absolute top-0.5 left-0.5 w-4 h-4 rounded-full bg-ink2 transition-transform"></span>
      </span>
      <span id="availability-label">Off Duty</span>
    </button>
    <button id="logout-btn" class="text-red-400 hover:text-red-300 text-xs transition">Logout</button>
  </div>
</header>

<div class="flex-1 flex overflow-hidden">
  <!-- Left panel -->
  <aside class="w-[380px] shrink-0 bg-surface border-r border-edge h-full flex flex-col overflow-y-auto">
    <div class="px-5 py-4 flex items-center justify-between border-b border-edge">
      <h2 class="text-ink font-bold text-sm">Job Feed</h2>
      <span id="ws-dot" class="w-2 h-2 rounded-full bg-red-500"></span>
    </div>

    <div id="active-delivery-section" class="hidden px-5 pt-4"></div>

    <div id="job-cards" class="px-5 py-4 flex flex-col gap-3 flex-1"></div>
  </aside>

  <!-- Map -->
  <div class="flex-1 relative">
    <div id="driver-map" class="w-full h-full"></div>
  </div>
</div>

<script src="{% static 'frontend/js/driver.js' %}"></script>
</body>
</html>
